<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WholeSale Grocery Store - Update Credentials</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="Index.css">
</head>
<body>
    <div class="login-container">
        <div class="left-panel">
            <div class="brand-wrapper">
                <h1 class="brand-title">WholeSale Grocery <br> Store</h1>
                <div class="logo-container">
                    <img src="Logo.png" alt="WholeSale Grocery Store Logo" class="brand-logo">
                </div>
            </div>
        </div>
        <div class="right-panel">
            <div class="login-card">
                <div class="card-header">
                    <span class="line"></span>
                    <h2>Update Credentials</h2>
                    <span class="line"></span>
                </div>

                <form id="reset-form">
                    <div class="input-label">New Username:</div>
                    <div class="input-wrapper">
                        <div class="icon-badge">
                            <img src="username.png" alt="">
                        </div>
                        <input type="text" id="new-user" placeholder="Enter new username" required>
                    </div>

                    <div class="input-label">New Password:</div>
                    <div class="input-wrapper">
                        <div class="icon-badge">
                            <img src="password.png" alt="">
                        </div>
                        <input type="password" id="new-pass" placeholder="Enter new password" required>
                        <span class="password-toggle"><i class="fa-regular fa-eye-slash"></i></span>
                    </div>

                    <button type="submit" class="login-btn" style="margin-top: 26px;">
                        <span>Save</span>
                        <i class="fa-solid fa-check"></i>
                    </button>

                    <a href="Index.html" class="back-to-login">Back to Login</a>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('reset-form');
            const newUser = document.getElementById('new-user');
            const newPass = document.getElementById('new-pass');
            const toggle = document.querySelector('.password-toggle');

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                localStorage.setItem('almares328_credentials', JSON.stringify({
                    username: newUser.value.trim(),
                    password: newPass.value
                }));
                alert('Credentials updated!');
                window.location.href = 'index.html';
            });

            if (toggle) {
                toggle.addEventListener('click', () => {
                    const isPass = newPass.type === 'password';
                    newPass.type = isPass ? 'text' : 'password';
                    toggle.querySelector('i').className = isPass ? 'fa-regular fa-eye' : 'fa-regular fa-eye-slash';
                });
            }
        });
    </script>
</body>
</html>

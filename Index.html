<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WholeSale Grocery Store - Login</title>
    <link rel="stylesheet" href="Index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="left-panel">
            <div class="brand-wrapper">
                <h1 class="brand-title">WholeSale Grocery <br> Store</h1>
                <div class="logo-container">
                    <img src="Logo.png" alt="WholeSale Grocery Store Logo" class="brand-logo">
                </div>
            </div>
        </div>
        <div class="right-panel">
            <div class="login-card">
                <div class="card-header">
                    <span class="line"></span>
                    <h2>Login</h2>
                    <span class="line"></span>
                </div>

                <form class="login-form">
                    <div class="input-label">Username:</div>
                    <div class="input-wrapper">
                        <div class="icon-badge">
                            <img src="username.png" alt="">
                        </div>
                        <input type="text" id="username" placeholder="Enter your username" required>
                    </div>

                    <div class="input-label">Password:</div>
                    <div class="input-wrapper">
                        <div class="icon-badge">
                            <img src="password.png" alt="">
                        </div>
                        <input type="password" id="password" placeholder="Enter your password" required>
                        <span class="password-toggle"><i class="fa-regular fa-eye-slash"></i></span>
                    </div>

                    <div class="forgot-password-container">
                        <a href="forgot-password.html" class="forgot-password">Forgot Password</a>
                    </div>

                    <button type="submit" class="login-btn">
                        <span>Login</span>
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>
    <script src="Index.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almares 328 - Inventory</title>
    <link rel="stylesheet" href="Inventory.css">
</head>
<body>

    <div class="container" id="sidebarContainer">

        <div class="drawer-container" id="leftPanel">
            <div class="drawer">
                <h1 class="logo">Almares 328</h1>

                <div class="menu">
                    <a href="dashboard.html" class="menu-btn">Dashboard</a>
                    <a href="sales.html" class="menu-btn">Sales</a>
                    <a href="inventory.html" class="menu-btn active">Inventory</a>
                    <a href="notification.html" class="menu-btn">Notification</a>
                    <a href="order.html" class="menu-btn">Orders</a>
                </div>

                <div class="sidebar-footer">
                    <button class="logout">Logout</button>
                </div>
            </div>
        </div>

        <div class="right-panel">

            <div class="top-bar">
                <h2>Search:</h2>
                <input type="text" class="search-input" placeholder="Search product...">
                <button class="add-btn" id="addBtn">+</button>
            </div>

            <div class="inventory-table" id="inventoryTable">
                <div class="table-header">
                    <div>Product</div>
                    <div>Category</div>
                    <div>Quantity</div>
                    <div>Status</div>
                    <div>Action</div>
                </div>

                <div class="table-body-spacer" id="bodySpacer">
                    <div id="inventoryBody"></div>
                </div>
            </div>

        </div>

    </div>

    <div class="modal" id="productModal">
        <div class="modal-content">
            <h2>Add Product</h2>

            <label for="product">Product Name</label>
            <input type="text" id="product">

            <label for="category">Category</label>
            <input type="text" id="category" placeholder="e.g. Beverages, Snacks">

            <label for="quantity">Quantity</label>
            <input type="number" id="quantity" min="0">

            <p class="auto-status-note">
                Status is set automatically:
                <strong>20 or below → Urgent Restock</strong>,
                <strong>21 or higher → In Stock</strong>
            </p>

            <div class="modal-buttons">
                <button class="save-btn" id="saveBtn">Save</button>
                <button class="cancel-btn" id="cancelBtn">Cancel</button>
            </div>
        </div>
    </div>

    <script src="Inventory.js"></script>
</body>
</html>

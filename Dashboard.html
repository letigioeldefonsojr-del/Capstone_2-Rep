<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almares 328 Dashboard</title>
    <link rel="stylesheet" href="Dashboard.css">
    <script src="Dashboard.js"></script>
</head>
<body>

    <div class="container" id="sidebarContainer">
        
        <div class="drawer-container" id="leftPanel">
            <div class="drawer">
                <h1 class="logo">Almares 328</h1>

                <div class="menu">
                    <a href="dashboard.html" class="menu-btn active">Dashboard</a>
                    <a href="sales.html" class="menu-btn">Sales</a>
                    <a href="inventory.html" class="menu-btn">Inventory</a>
                    <a href="notification.html" class="menu-btn">Notification</a>
                    <a href="order.html" class="menu-btn">Orders</a>

                </div>
                
                <div class="sidebar-footer">
                    <button class="logout">Logout</button>
                </div>
            </div>
        </div>

            <div class="main-content">
            
            <div class="cards">
                <div class="card product">
                    <img src="product.png" alt="Total Products Icon" class="card-icon">
                    <h2>300</h2>
                    <p>Total Product</p>
                </div>

                <div class="card restock">
                    <img src="alarm.png" alt="Urgent Stock Icon" class="card-icon">
                    <h2>1</h2>
                    <p>Urgent Restock</p>
                </div>

                <div class="card orders">
                    <img src="order.png" alt="Orders Icon" class="card-icon">
                    <h2>3</h2>
                    <p>Orders</p>  
                </div>
            </div>

            <div class="notification urgent">
                <h3>⚠ Urgent Restock</h3>
                <p>1 item need restocking. Please review and order supplies</p>
                <button class="notif-btn" onclick="window.location.href='notification.html'">View Notification</button>
            </div>

            <div class="notification pending">
                <h3>⚠ Pending Orders</h3>
                <p>3 items pending Order. Please review to accomplish.</p>
                <button class="ord-btn" onclick="window.location.href='order.html'">View Orders</button>
            </div>
        </div>
    </div>
</body>
</html>

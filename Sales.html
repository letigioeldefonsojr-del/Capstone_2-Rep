<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almares 328 - Sales</title>
    <link rel="stylesheet" href="Sales.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div class="container">
        <div class="left-panel">
            <div class="sidebar">
                <h1 class="logo">Almares 328</h1>

                <div class="menu">
                    <a href="dashboard.html" class="menu-btn">Dashboard</a>
                    <a href="sales.html" class="menu-btn active">Sales</a>
                    <a href="inventory.html" class="menu-btn">Inventory</a>
                    <a href="notification.html" class="menu-btn">Notification</a>
                    <a href="order.html" class="menu-btn">Orders</a>
                </div>

                <button class="logout">Logout</button>
            </div>
        </div>


        <div class="main-content">
            
            <div class="top-pagination-header">
                <a href="Sales2.html" class="sales-next-page-btn" title="Go to Next Page">
                    <img src="Next.png" alt="Next Page" class="next-img-icon">
                </a>
            </div>
            
            <div class="cards">
                <div class="card">
                    <h3>Daily Sales</h3>
                    <h2>₱ 10,000</h2>
                    <p class="card-footer">April 20, 2026</p>
                </div>

                <div class="card">
                    <h3>Monthly Sales</h3>
                    <h2>₱ 40,000</h2>
                    <p class="card-footer">Current Month total</p>
                </div>

                <div class="card">
                    <h3>Yearly Sales</h3>
                    <h2>₱ 90,000</h2>
                    <p class="card-footer">Year-to-date total</p>
                </div>
            </div>

            <div class="graph-wrapper">
                <div class="graph-header">
                    <select class="date-dropdown-btn" id="timeframeSelector">
                        </select>
                </div>
                
                <div class="chart-section">
                    <canvas id="salesLineChart"></canvas>
                </div>
            </div>

        </div>
    </div>

        <script src="sales.js"></script>
</body>
</html>
